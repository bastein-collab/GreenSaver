name: Ingest NJ Stores
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      INGEST_REPORT: ingest_report.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          echo "Top-level files and folders:"
          ls -la
          echo ".github/workflows contents:"
          ls -la .github/workflows || true
          echo "deals-finder contents (if present):"
          ls -la deals-finder || true

      - name: Locate project directory (check .github/workflows first, then deals-finder, then search)
        id: locate
        run: |
          # Prefer package.json inside .github/workflows if you intentionally put the Node project there
          if [ -f ".github/workflows/package.json" ]; then
            echo "project_dir=.github/workflows" >> $GITHUB_OUTPUT
            echo "Found package.json at .github/workflows/package.json"
            exit 0
          fi

          # Next preference: deals-finder
          if [ -f "deals-finder/package.json" ]; then
            echo "project_dir=deals-finder" >> $GITHUB_OUTPUT
            echo "Found package.json at deals-finder/package.json"
            exit 0
          fi

          # Fallback: search the repo (limit depth to avoid long searches)
          P=$(find . -maxdepth 6 -type f -name package.json -print -quit || true)
          if [ -n "$P" ]; then
            D=$(dirname "$P")
            D=${D#./}
            echo "project_dir=$D" >> $GITHUB_OUTPUT
            echo "Found package.json at $P"
          else
            echo "project_dir=" >> $GITHUB_OUTPUT
          fi

      - name: Fail early if no package.json found
        if: ${{ steps.locate.outputs.project_dir == '' }}
        run: |
          echo "Error: package.json not found in repository (checked .github/workflows, deals-finder, and searched up to depth 6)."
          echo "Place your Node project's package.json in the repo (recommended: project root or deals-finder/), or update this workflow to the correct path."
          exit 1

      - name: Copy stores file into project (if it lives in .github/workflows)
        if: ${{ steps.locate.outputs.project_dir != '' }}
        run: |
          # If you placed stores.nj.json (or CSV) in .github/workflows, copy it into the discovered project dir.
          SRC_JSON=".github/workflows/stores.nj.json"
          SRC_CSV=".github/workflows/stores.nj.csv"
          DST_DIR="${{ steps.locate.outputs.project_dir }}/scripts/ingest"
          mkdir -p "$DST_DIR"
          if [ -f "$SRC_JSON" ]; then
            cp "$SRC_JSON" "$DST_DIR/stores.nj.json"
            echo "Copied $SRC_JSON -> $DST_DIR/stores.nj.json"
          elif [ -f "$SRC_CSV" ]; then
            cp "$SRC_CSV" "$DST_DIR/stores.nj.csv"
            echo "Copied $SRC_CSV -> $DST_DIR/stores.nj.csv"
          else
            echo "No stores file found under .github/workflows — skipping copy."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        if: ${{ steps.locate.outputs.project_dir != '' }}
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          # Prefer `npm ci` when lockfile exists (reproducible); fall back to `npm install`.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Found lockfile — running npm ci"
            npm ci
          elif [ -f package.json ]; then
            echo "No lockfile found — running npm install"
            npm install
          else
            echo "Error: package.json not found in ${PWD}"
            exit 1
          fi

      - name: Install Playwright (Chromium)
        if: ${{ steps.locate.outputs.project_dir != '' }}
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npx playwright install --with-deps chromium

      - name: Resolve store IDs
        if: ${{ steps.locate.outputs.project_dir != '' }}
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          DEALS_STORES_ENDPOINT: ${{ vars.DEALS_STORES_ENDPOINT }}
        shell: bash
        run: |
          # Use the copied JSON/CSV in scripts/ingest if present, otherwise use whatever the project already contains.
          if [ -f scripts/ingest/stores.nj.json ]; then
            echo "Using scripts/ingest/stores.nj.json"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.json > scripts/ingest/stores.nj.resolved.json
          elif [ -f scripts/ingest/stores.nj.csv ]; then
            echo "Using scripts/ingest/stores.nj.csv"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.csv > scripts/ingest/stores.nj.resolved.json
          elif [ -f scripts/ingest/stores.nj.orig ]; then
            echo "Using scripts/ingest/stores.nj.orig"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.orig > scripts/ingest/stores.nj.resolved.json
          else
            echo "Error: no input stores file found in project scripts/ingest"
            exit 1
          fi

      - name: Ingest chunk (rolling)
        if: ${{ steps.locate.outputs.project_dir != '' }}
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEALS_HEADERS_JSON: ${{ secrets.DEALS_HEADERS_JSON }}
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE }}
          TOTAL_STORES: ${{ vars.TOTAL_STORES }}
          INGEST_REPORT: ingest_report.json
        run: |
          CHUNK_SIZE=${CHUNK_SIZE:-25}
          TOTAL=${TOTAL_STORES:-275}
          IDX=$(( ( ( $(date +%s) / 60 ) / 15 ) % ( (TOTAL + CHUNK_SIZE - 1) / CHUNK_SIZE ) ))
          OFFSET=$(( IDX * CHUNK_SIZE ))
          echo "Processing chunk index=$IDX offset=$OFFSET size=$CHUNK_SIZE of total=$TOTAL"
          node -r dotenv/config scripts/ingest/multi_store.mjs scripts/ingest/stores.nj.resolved.json --limit $CHUNK_SIZE --offset $OFFSET --concurrency 1

      - name: Upload ingest report
        if: ${{ steps.locate.outputs.project_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_id }}
          path: ${{ steps.locate.outputs.project_dir }}/ingest_report.json
