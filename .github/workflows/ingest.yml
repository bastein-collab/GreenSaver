name: Ingest NJ Stores

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes (chunked)

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      INGEST_REPORT: ingest_report.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          echo "Top-level files and folders:"
          ls -la
          echo ".github/workflows contents:"
          ls -la .github/workflows || true
          echo "deals-finder contents (if present):"
          ls -la deals-finder || true

      - name: Copy stores.nj.json from workflows folder into project
        run: |
          SRC=".github/workflows/stores.nj.json"
          DST="deals-finder/scripts/ingest/stores.nj.json"
          if [ -f "$SRC" ]; then
            echo "Copying $SRC -> $DST"
            mkdir -p "$(dirname "$DST")"
            cp "$SRC" "$DST"
            echo "Copied OK"
          else
            echo "No $SRC found — if your resolve script uses a different input, it will run against repository-local files."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: deals-finder
        shell: bash
        run: |
          # Prefer reproducible installs when lockfile exists; otherwise fall back to npm install.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Found lockfile — running npm ci"
            npm ci
          elif [ -f package.json ]; then
            echo "No lockfile found — running npm install"
            npm install
          else
            echo "Error: package.json not found in deals-finder (expected deals-finder/package.json)"
            exit 1
          fi

      - name: Install Playwright (Chromium)
        working-directory: deals-finder
        run: npx playwright install --with-deps chromium

      - name: Resolve store IDs
        working-directory: deals-finder
        env:
          DEALS_STORES_ENDPOINT: ${{ vars.DEALS_STORES_ENDPOINT }}
        shell: bash
        run: |
          # If we copied .github/workflows/stores.nj.json into the project, use it.
          if [ -f scripts/ingest/stores.nj.json ]; then
            echo "Using scripts/ingest/stores.nj.json (copied from .github/workflows)"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.json > scripts/ingest/stores.nj.resolved.json
          elif [ -f scripts/ingest/stores.nj.json.orig ]; then
            echo "Using scripts/ingest/stores.nj.json.orig"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.json.orig > scripts/ingest/stores.nj.resolved.json
          elif [ -f scripts/ingest/stores.nj.csv ]; then
            echo "Using scripts/ingest/stores.nj.csv"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.csv > scripts/ingest/stores.nj.resolved.json
          else
            echo "No input stores file found in deals-finder/scripts/ingest; please ensure the file is present or adjust workflow."
            exit 1
          fi

      - name: Ingest chunk (rolling)
        working-directory: deals-finder
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEALS_HEADERS_JSON: ${{ secrets.DEALS_HEADERS_JSON }}
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE }}
          TOTAL_STORES: ${{ vars.TOTAL_STORES }}
          INGEST_REPORT: ingest_report.json
        run: |
          CHUNK_SIZE=${CHUNK_SIZE:-25}
          TOTAL=${TOTAL_STORES:-275}
          IDX=$(( ( ( $(date +%s) / 60 ) / 15 ) % ( (TOTAL + CHUNK_SIZE - 1) / CHUNK_SIZE ) ))
          OFFSET=$(( IDX * CHUNK_SIZE ))
          echo "Processing chunk index=$IDX offset=$OFFSET size=$CHUNK_SIZE of total=$TOTAL"
          node -r dotenv/config scripts/ingest/multi_store.mjs scripts/ingest/stores.nj.resolved.json --limit $CHUNK_SIZE --offset $OFFSET --concurrency 1

      - name: Upload ingest report
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_id }}
          path: deals-finder/ingest_report.json
