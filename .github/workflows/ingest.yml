name: Ingest NJ Stores

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes (chunked)

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      INGEST_REPORT: ingest_report.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate CSV in GreenSaver/.github/workflows
        id: locate_csv
        run: |
          # look specifically for a CSV under GreenSaver/.github/workflows
          CSV=$(find "$GITHUB_WORKSPACE/GreenSaver/.github/workflows" -maxdepth 1 -type f -name '*.csv' -print -quit || true)
          if [ -z "$CSV" ]; then
            echo "No CSV found at $GITHUB_WORKSPACE/GreenSaver/.github/workflows"
            echo "CSV_PATH=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found CSV: $CSV"
          echo "CSV_PATH=$CSV" >> $GITHUB_OUTPUT

      - name: Copy CSV into deals-finder (so project steps can access it)
        if: ${{ steps.locate_csv.outputs.CSV_PATH != '' }}
        run: |
          mkdir -p deals-finder
          cp "${{ steps.locate_csv.outputs.CSV_PATH }}" deals-finder/ingest_input.csv
          echo "Copied CSV to deals-finder/ingest_input.csv"

      - name: Install deps
        working-directory: deals-finder
        shell: bash
        run: |
          # Prefer reproducible installs when a lockfile exists; otherwise fall back to npm install.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Found lockfile — running npm ci"
            npm ci
          elif [ -f package.json ]; then
            echo "No lockfile found — running npm install"
            npm install
          else
            echo "Error: package.json not found in deals-finder"
            exit 1
          fi

      - name: Install Playwright (Chromium)
        working-directory: deals-finder
        run: npx playwright install --with-deps chromium

      - name: Resolve store IDs
        working-directory: deals-finder
        env:
          DEALS_STORES_ENDPOINT: ${{ vars.DEALS_STORES_ENDPOINT }}
        run: |
          # If your resolve script expects a CSV path, it can read deals-finder/ingest_input.csv
          # Otherwise it will use the repository-local JSON path as before.
          if [ -f ingest_input.csv ]; then
            echo "Running resolve_store_ids_batch using deals-finder/ingest_input.csv"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs ingest_input.csv > scripts/ingest/stores.nj.resolved.json
          else
            echo "Running resolve_store_ids_batch using scripts/ingest/stores.nj.json"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.json > scripts/ingest/stores.nj.resolved.json
          fi

      - name: Ingest chunk (rolling)
        working-directory: deals-finder
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEALS_HEADERS_JSON: ${{ secrets.DEALS_HEADERS_JSON }}
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE }}
          TOTAL_STORES: ${{ vars.TOTAL_STORES }}
          INGEST_REPORT: ingest_report.json
        run: |
          CHUNK_SIZE=${CHUNK_SIZE:-25}
          TOTAL=${TOTAL_STORES:-275}
          IDX=$(( ( ( $(date +%s) / 60 ) / 15 ) % ( (TOTAL + CHUNK_SIZE - 1) / CHUNK_SIZE ) ))
          OFFSET=$(( IDX * CHUNK_SIZE ))
          echo "Processing chunk index=$IDX offset=$OFFSET size=$CHUNK_SIZE of total=$TOTAL"
          node -r dotenv/config scripts/ingest/multi_store.mjs scripts/ingest/stores.nj.resolved.json --limit $CHUNK_SIZE --offset $OFFSET --concurrency 1

      - name: Upload ingest report
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_id }}
          path: deals-finder/ingest_report.json
