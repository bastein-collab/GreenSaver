# Ingest workflow - safe handling when package.json is missing
# Detects package.json and only runs Node steps if found.
# Adjust node-version and paths to match your project if needed.

name: Ingest

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - '**/*'
  pull_request:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find package.json (root, deals-finder, or search up to depth 6)
        id: find_pkg
        run: |
          set -e
          echo "Searching for package.json..."
          PKG_PATH=""

          # check common locations
          if [ -f "./package.json" ]; then
            PKG_PATH="."
          elif [ -f "./deals-finder/package.json" ]; then
            PKG_PATH="deals-finder"
          else
            # fallback global search (limit depth)
            FOUND=$(find . -maxdepth 6 -type f -name package.json -print -quit || true)
            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              # remove leading ./ if present
              PKG_PATH="${DIR#./}"
            fi
          fi

          if [ -n "$PKG_PATH" ]; then
            echo "Found package.json at: $PKG_PATH"
            echo "pkg_path=$PKG_PATH" >> $GITHUB_OUTPUT
            echo "pkg_found=true" >> $GITHUB_OUTPUT
          else
            echo "No package.json found in repository."
            echo "pkg_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node (only if package.json found)
        if: steps.find_pkg.outputs.pkg_found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18' # change if you need a different version

      - name: Install dependencies (only if package.json found)
        if: steps.find_pkg.outputs.pkg_found == 'true'
        run: |
          echo "Installing dependencies in ${{ steps.find_pkg.outputs.pkg_path }}"
          npm ci --prefix "${{ steps.find_pkg.outputs.pkg_path }}"

      - name: Run build and tests (only if package.json found)
        if: steps.find_pkg.outputs.pkg_found == 'true'
        run: |
          echo "Running build/test in ${{ steps.find_pkg.outputs.pkg_path }}"
          # run build/test if scripts exist; failures here might be expected depending on repo
          npm run build --prefix "${{ steps.find_pkg.outputs.pkg_path }}" || true
          npm test --prefix "${{ steps.find_pkg.outputs.pkg_path }}" || true

      - name: No package.json found — skip Node steps
        if: steps.find_pkg.outputs.pkg_found == 'false'
        run: |
          echo "No package.json found. Skipping Node setup, install and test steps."
