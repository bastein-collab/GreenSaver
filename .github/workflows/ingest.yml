name: Ingest NJ Stores

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes (chunked)

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      INGEST_REPORT: ingest_report.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          echo "Top-level:"
          ls -la
          echo "Show .github/workflows:"
          ls -la .github/workflows || true
          echo "Show deals-finder (if present):"
          ls -la deals-finder || true

      - name: Copy stores CSV into project (if present)
        shell: bash
        run: |
          # If CSV exists in .github/workflows (as shown in your repo), copy it into the deals-finder working dir
          SRC=".github/workflows/stores.nj.csv"
          DST="deals-finder/ingest_input.csv"
          if [ -f "$SRC" ]; then
            mkdir -p "$(dirname "$DST")"
            cp "$SRC" "$DST"
            echo "Copied $SRC -> $DST"
          else
            echo "No CSV at $SRC; continuing (workflow may use repo JSON instead)."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: deals-finder
        shell: bash
        run: |
          # Prefer `npm ci` when a lockfile exists (reproducible); fall back to `npm install`.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Found lockfile — running npm ci"
            npm ci
          elif [ -f package.json ]; then
            echo "No lockfile found — running npm install"
            npm install
          else
            echo "Error: package.json not found in deals-finder"
            exit 1
          fi

      - name: Install Playwright (Chromium)
        working-directory: deals-finder
        run: npx playwright install --with-deps chromium

      - name: Resolve store IDs
        working-directory: deals-finder
        env:
          DEALS_STORES_ENDPOINT: ${{ vars.DEALS_STORES_ENDPOINT }}
        shell: bash
        run: |
          # Prefer CSV copied into project (deals-finder/ingest_input.csv) if present,
          # otherwise fall back to the repo-local JSON file used previously.
          if [ -f ingest_input.csv ]; then
            echo "Using deals-finder/ingest_input.csv as input to resolve_store_ids_batch"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs ingest_input.csv > scripts/ingest/stores.nj.resolved.json
          elif [ -f scripts/ingest/stores.nj.json ]; then
            echo "Using scripts/ingest/stores.nj.json as input to resolve_store_ids_batch"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.json > scripts/ingest/stores.nj.resolved.json
          else
            echo "Error: no input CSV or scripts/ingest/stores.nj.json found in deals-finder"
            exit 1
          fi

      - name: Ingest chunk (rolling)
        working-directory: deals-finder
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEALS_HEADERS_JSON: ${{ secrets.DEALS_HEADERS_JSON }}
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE }}
          TOTAL_STORES: ${{ vars.TOTAL_STORES }}
          INGEST_REPORT: ingest_report.json
        run: |
          CHUNK_SIZE=${CHUNK_SIZE:-25}
          TOTAL=${TOTAL_STORES:-275}
          IDX=$(( ( ( $(date +%s) / 60 ) / 15 ) % ( (TOTAL + CHUNK_SIZE - 1) / CHUNK_SIZE ) ))
          OFFSET=$(( IDX * CHUNK_SIZE ))
          echo "Processing chunk index=$IDX offset=$OFFSET size=$CHUNK_SIZE of total=$TOTAL"
          node -r dotenv/config scripts/ingest/multi_store.mjs scripts/ingest/stores.nj.resolved.json --limit $CHUNK_SIZE --offset $OFFSET --concurrency 1

      - name: Upload ingest report
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_id }}
          path: deals-finder/ingest_report.json
