name: Ingest NJ Stores

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes (chunked)

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      INGEST_REPORT: ingest_report.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          echo "Top-level files and folders:"
          ls -la
          echo "Show .github/workflows (where your CSV appears):"
          ls -la .github/workflows || true
          echo "Show deals-finder (if present):"
          ls -la deals-finder || true

      - name: Copy CSV from .github/workflows into project (if present)
        run: |
          SRC=".github/workflows/stores.nj.csv"
          DST="deals-finder/ingest_input.csv"
          if [ -f "$SRC" ]; then
            mkdir -p "$(dirname "$DST")"
            cp "$SRC" "$DST"
            echo "Copied $SRC -> $DST"
          else
            echo "No CSV at $SRC; continuing (workflow may use repo JSON instead)."
          fi

      - name: Locate project directory (prefer deals-finder)
        id: locate
        run: |
          # Prefer explicit deals-finder path if present (you stated package.json lives there)
          if [ -f "deals-finder/package.json" ]; then
            echo "project_dir=deals-finder" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Otherwise search for the first package.json (limit depth to avoid long searches)
          P=$(find . -maxdepth 6 -type f -name package.json -print -quit || true)
          if [ -n "$P" ]; then
            D=$(dirname "$P")
            D=${D#./}
            echo "project_dir=$D" >> $GITHUB_OUTPUT
            echo "Found package.json at $P"
          else
            echo "project_dir=" >> $GITHUB_OUTPUT
          fi

      - name: Fail early if no package.json found
        if: ${{ steps.locate.outputs.project_dir == '' }}
        run: |
          echo "Error: package.json not found in repository (searched for deals-finder/package.json and up to depth 6)."
          echo "Your Node project must be committed to the repo for Actions to run npm."
          echo "If your project is in a subfolder, either:"
          echo "  - Commit the folder (e.g. deals-finder) containing package.json to the repo,"
          echo "  - Or update this workflow to set working-directory explicitly to the correct path."
          exit 1

      - name: Show resolved project directory
        if: ${{ steps.locate.outputs.project_dir != '' }}
        run: |
          echo "Using project_dir='${{ steps.locate.outputs.project_dir }}'"
          ls -la "${{ steps.locate.outputs.project_dir }}" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        if: ${{ steps.locate.outputs.project_dir != '' }}
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          # Prefer `npm ci` when lockfile exists (reproducible); fall back to `npm install`.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Found lockfile — running npm ci"
            npm ci
          elif [ -f package.json ]; then
            echo "No lockfile found — running npm install"
            npm install
          else
            echo "Error: package.json not found in ${PWD}"
            exit 1
          fi

      - name: Install Playwright (Chromium)
        if: ${{ steps.locate.outputs.project_dir != '' }}
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npx playwright install --with-deps chromium

      - name: Resolve store IDs
        if: ${{ steps.locate.outputs.project_dir != '' }}
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          DEALS_STORES_ENDPOINT: ${{ vars.DEALS_STORES_ENDPOINT }}
        run: |
          # Prefer CSV copied into project (deals-finder/ingest_input.csv) if present,
          # otherwise fall back to scripts/ingest/stores.nj.json in the project dir.
          if [ -f ingest_input.csv ]; then
            echo "Using deals-finder/ingest_input.csv as input to resolve_store_ids_batch"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs ingest_input.csv > scripts/ingest/stores.nj.resolved.json
          elif [ -f scripts/ingest/stores.nj.json ]; then
            echo "Using scripts/ingest/stores.nj.json as input to resolve_store_ids_batch"
            node -r dotenv/config scripts/ingest/resolve_store_ids_batch.mjs scripts/ingest/stores.nj.json > scripts/ingest/stores.nj.resolved.json
          else
            echo "Error: no input CSV or scripts/ingest/stores.nj.json found in project dir"
            exit 1
          fi

      - name: Ingest chunk (rolling)
        if: ${{ steps.locate.outputs.project_dir != '' }}
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEALS_HEADERS_JSON: ${{ secrets.DEALS_HEADERS_JSON }}
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE }}
          TOTAL_STORES: ${{ vars.TOTAL_STORES }}
          INGEST_REPORT: ingest_report.json
        run: |
          CHUNK_SIZE=${CHUNK_SIZE:-25}
          TOTAL=${TOTAL_STORES:-275}
          IDX=$(( ( ( $(date +%s) / 60 ) / 15 ) % ( (TOTAL + CHUNK_SIZE - 1) / CHUNK_SIZE ) ))
          OFFSET=$(( IDX * CHUNK_SIZE ))
          echo "Processing chunk index=$IDX offset=$OFFSET size=$CHUNK_SIZE of total=$TOTAL"
          node -r dotenv/config scripts/ingest/multi_store.mjs scripts/ingest/stores.nj.resolved.json --limit $CHUNK_SIZE --offset $OFFSET --concurrency 1

      - name: Upload ingest report
        if: ${{ steps.locate.outputs.project_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_id }}
          path: ${{ steps.locate.outputs.project_dir }}/ingest_report.json
